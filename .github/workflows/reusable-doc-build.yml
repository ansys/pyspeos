name: Documentation style and build

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version used to build the documentation'
        required: false
        type: string
        default: '3.14'
      speos-version:
        description: 'Speos RPC container tag used to build the documentation examples'
        required: false
        type: string
        default: 'dev'
      run-doc-style:
        description: 'Run the PyAnsys documentation style check before building the documentation'
        required: false
        type: boolean
        default: true
    secrets:
      LICENSE_SERVER:
        required: true

env:
  ON_CI: true
  BUILD_CHEATSHEET: 'true'

# Disable all default permissions at workflow level for security (least privilege principle)
# Individual jobs will explicitly request only the permissions they need
permissions: {}

jobs:
  doc-style:
    name: Documentation style check
    if: inputs.run-doc-style
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required to read documentation files for style checking
    steps:
      - name: PyAnsys documentation style checks
        uses: ansys/actions/doc-style@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  doc-build:
    name: Documentation build
    needs: [doc-style]
    # Run when doc-style passed or was skipped (run-doc-style: false)
    if: ${{ !cancelled() && (needs.doc-style.result == 'success' || needs.doc-style.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required to read documentation files for building
      packages: read   # Required to pull images from GitHub Container Registry (ghcr.io)
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up headless display
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4 # v5.2.0

      - name: Login to GitHub Packages
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io/ansys
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        shell: bash
        env:
          ANSYSLMD_LICENSE_FILE: 1055@${{ secrets.LICENSE_SERVER }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          SPEOS_VERSION: ${{ inputs.speos-version }}
        run: |
          docker run --detach --name speos-rpc -p 127.0.0.1:50098:50098 -e SPEOS_LOG_LEVEL=2 -e ANSYSLMD_LICENSE_FILE=${ANSYSLMD_LICENSE_FILE} -v "${GITHUB_WORKSPACE}/tests/assets:/app/assets" --entrypoint /app/SpeosRPC_Server.x ghcr.io/ansys/speos-rpc:${SPEOS_VERSION} --transport_insecure --host 0.0.0.0

      - name: Run Ansys documentation building action
        uses: ansys/actions/doc-build@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          python-version: ${{ inputs.python-version }}
          check-links: false
          sphinxopts: -j 1 --keep-going # Try without parallel execution
          checkout: false
          dependencies: "pandoc"
          needs-quarto: true
          optional-dependencies-name: 'graphics'
          group-dependencies-name: 'doc'

      - name: Stop container
        shell: bash
        run: |
          docker kill speos-rpc
          docker rm speos-rpc
