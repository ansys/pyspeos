name: GitHub CI

on:
  push:
    tags:
      - "v*.*.*"

env:
  MAIN_PYTHON_VERSION: '3.14'
  DOCUMENTATION_CNAME: 'speos.docs.pyansys.com'
  PACKAGE_NAMESPACE: 'ansys.speos.core'
  PACKAGE_NAME: 'ansys-speos-core'
  BUILD_CHEATSHEET: 'true'
  ON_CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Disable all default permissions at workflow level for security (least privilege principle)
# Individual jobs will explicitly request only the permissions they need
permissions: {}

jobs:

  update-changelog:
    name: Update CHANGELOG (on release)
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Required to commit and push changelog updates to the repository
      pull-requests: write   # Required to create pull requests with changelog updates
    steps:
      - uses: ansys/actions/doc-deploy-changelog@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

  code-quality:
    name: Code quality
    permissions:
      contents: read   # Required to read repository content for quality checks
    secrets:
      PYANSYS_CI_BOT_TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
    uses: $/.github/workflows/reusable-code-quality.yml

  doc-build:
    name: Documentation
    permissions:
      contents: read   # Required to read documentation files for building
      packages: read   # Required to pull images from GitHub Container Registry (ghcr.io)
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
    uses: $/.github/workflows/reusable-doc-build.yml

  # NOTE: Should this job be using ansys/actions/tests-pytest ?
  # @todo smorais: verify that smoke tests with attest-provenance: true (now shared with pull-request.yml) are correct for release
  testing:
    name: Smoke tests, testing and coverage
    permissions:
      attestations: write   # Required by smoke tests to publish build attestations (SLSA provenance)
      contents: read        # Required to read repository content for testing
      id-token: write       # Required by smoke tests for OIDC token generation (provenance signing)
      packages: read        # Required to pull images from GitHub Container Registry (ghcr.io)
    secrets:
      LICENSE_SERVER: ${{ secrets.LICENSE_SERVER }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    uses: $/.github/workflows/reusable-speos-tests.yml

  build-library:
    name: Build library
    needs: [code-quality, doc-build, testing]
    runs-on: ubuntu-latest
    permissions:
      attestations: write   # Required to create and publish package attestations (SLSA provenance)
      contents: read        # Required to read repository content for packaging
      id-token: write       # Required for OIDC token generation (for provenance signing)
    steps:
      - name: Build library source and wheel artifacts
        uses: ansys/actions/build-library@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          # @todo smorais: verify that enabling attest-provenance on release (aligned with pull-request.yml) is correct
          attest-provenance: true
          library-name: ${{ env.PACKAGE_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}

  release:
    name: Release project
    needs: [build-library]
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: release
    permissions:
      id-token: write   # Required for OIDC authentication to PyPI (trusted publisher)
      contents: write   # Required to create GitHub releases and upload release assets
    steps:
      - name: Download the library artifacts from build-library step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}-artifacts
          path: ${{ env.PACKAGE_NAME }}-artifacts

      - name: Release to PyPI using trusted publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.PACKAGE_NAME }}-artifacts
          skip-existing: false

      - name: Release to GitHub
        uses: ansys/actions/release-github@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

  doc-deploy-stable:
    name: Upload release documentation
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to commit and push documentation to gh-pages branch
    steps:
      - name: Deploy the stable documentation
        uses: ansys/actions/doc-deploy-stable@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          cname: ${{ env.DOCUMENTATION_CNAME }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
