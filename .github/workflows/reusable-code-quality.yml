name: Code quality checks

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version used for the quality checks'
        required: false
        type: string
        default: '3.14'
      package-name:
        description: 'Name of the Python package to check'
        required: false
        type: string
        default: 'ansys-speos-core'
    secrets:
      PYANSYS_CI_BOT_TOKEN:
        required: true

# Disable all default permissions at workflow level for security (least privilege principle)
# Individual jobs will explicitly request only the permissions they need
permissions: {}

jobs:
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required to read repository content for vulnerability scanning
    steps:
      - uses: ansys/actions/check-vulnerabilities@a5c8d0d92928e144130a3c64aa7200b9547785de # v11.1.3
        with:
          python-version: ${{ inputs.python-version }}
          python-package-name: ${{ inputs.package-name }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          dev-mode: ${{ github.ref != 'refs/heads/main' }}
          extra-targets: 'graphics,jupyter'

  type-check:
    name: Type check with Ty
    runs-on: ubuntu-latest
    permissions:
      contents: read   # Required to read repository content for type checking
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          prune-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --only-group quality --no-install-project

      # NOTE: At the moment this will only run on a subset of files like ansys/speos/core/speos.py
      # See the pyproject.toml configuration for more information on excluded files/folders
      - name: Run Ty on selected files
        run: |
          source .venv/bin/activate
          ty check
